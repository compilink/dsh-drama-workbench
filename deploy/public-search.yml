use_default_settings:
  engines:
    keep_only: [baidu, sogou, 360search, google, bing, duckduckgo, brave, yahoo, google news, bing news, google scholar, openlibrary]
server:
  secret_key: __GENERATE_AT_START__
  limiter: false
  public_instance: false
  image_proxy: false
search:
  formats: [html, json]
outgoing:
  request_timeout: 8.0
engines:
  - {name: baidu, disabled: false}
  - {name: sogou, disabled: false}
  - {name: 360search, disabled: false}
  - {name: google, disabled: false}
  - {name: bing, disabled: false}
  - {name: duckduckgo, disabled: false}
  - {name: brave, disabled: false}
  - {name: yahoo, disabled: false}
  - {name: google news, disabled: false}
  - {name: bing news, disabled: false}
  - {name: google scholar, disabled: false}
  - {name: openlibrary, disabled: false}
